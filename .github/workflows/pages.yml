name: Publish Market Narrative Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enforce_publish_window:
        description: "Block dispatch runs if the 07:15 publish window has expired"
        required: false
        default: "true"
      allow_late_publish:
        description: "Manual recovery only: allow publish after the configured window"
        required: false
        default: "false"
      allow_fixture_fallback:
        description: "Manual test only: allow fixture-news fallback after live generation fails"
        required: false
        default: "false"
      allow_non_trading_day:
        description: "Manual test only: allow non-trading-day digest generation"
        required: false
        default: "false"
      summary_time:
        description: "auto, 07:15, or 08:00"
        required: false
        default: "auto"
      triggered_by:
        description: "Manual label for the trigger source"
        required: false
        default: "manual"
  schedule:
    # Weekday 07:00-07:45 IST attempts for the 07:15 briefing.
    - cron: "30,45 1 * * 1-5"
    - cron: "0,15 2 * * 1-5"
    # Weekday 08:00-09:00 IST attempts for the 08:00 incremental briefing.
    - cron: "30,45 2 * * 1-5"
    - cron: "0,15,30 3 * * 1-5"
    # Sunday 07:00-07:45 IST attempts for the general Market Update edition.
    # (Weekday holidays are already covered by the 1-5 crons above; Saturdays are
    # intentionally skipped — only Sundays publish a general edition.)
    - cron: "30,45 1 * * 0"
    - cron: "0,15 2 * * 0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Compute IST summary date and slot
        run: |
          SUMMARY_DATE="$(TZ=Asia/Kolkata date +%F)"
          IST_HH="$(TZ=Asia/Kolkata date +%H)"
          IST_MM="$(TZ=Asia/Kolkata date +%M)"
          IST_MINUTES=$((10#$IST_HH * 60 + 10#$IST_MM))
          SUMMARY_TIME="07:15"
          if [ "$IST_MINUTES" -ge 480 ]; then
            SUMMARY_TIME="08:00"
          fi
          MANUAL_SUMMARY_TIME="${{ github.event.inputs.summary_time }}"
          if [ -n "$MANUAL_SUMMARY_TIME" ] && [ "$MANUAL_SUMMARY_TIME" != "auto" ]; then
            SUMMARY_TIME="$MANUAL_SUMMARY_TIME"
          fi
          SUMMARY_LABEL="${SUMMARY_TIME/:/}"
          echo "SUMMARY_DATE=$SUMMARY_DATE" >> "$GITHUB_ENV"
          echo "SUMMARY_TIME=$SUMMARY_TIME" >> "$GITHUB_ENV"
          echo "SUMMARY_LABEL=$SUMMARY_LABEL" >> "$GITHUB_ENV"

      - name: Check existing verified archive
        run: |
          ARCHIVE_FILE="archive/daily/${SUMMARY_DATE}-${SUMMARY_LABEL}-digest.json"
          if git ls-files --error-unmatch "$ARCHIVE_FILE" >/dev/null 2>&1; then
            echo "ARCHIVE_ALREADY_TRACKED=true" >> "$GITHUB_ENV"
            echo "Verified archive already tracked: $ARCHIVE_FILE"
          else
            echo "ARCHIVE_ALREADY_TRACKED=false" >> "$GITHUB_ENV"
          fi

      - name: Test generator
        run: npm test

      - name: Generate scheduled IST summary
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.ARCHIVE_ALREADY_TRACKED != 'true'
        env:
          MARKET_DATA_MODE: live
          ALLOW_INSUFFICIENT_SOURCES: "true"
          PREMARKET_LATE_CUTOFF_MINUTES: "60"
          PUBLIC_BRIEFING_AGENT_RERANK: "true"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PULSE_API_KEY: ${{ secrets.PULSE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.allow_late_publish }}" = "true" ]; then
            export ALLOW_LATE_PREMARKET_PUBLISH=true
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.allow_non_trading_day }}" = "true" ]; then
            export ALLOW_NON_TRADING_DAY_DIGEST=true
          fi
          PUBLISH_ARGS=(--date "$SUMMARY_DATE" --scheduled-time "$SUMMARY_TIME" --market-data live)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.enforce_publish_window }}" = "true" ]; then
            PUBLISH_ARGS+=(--enforce-publish-window)
          fi
          if ! npm run daily:generate -- "${PUBLISH_ARGS[@]}"; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.allow_fixture_fallback }}" = "true" ]; then
              echo "Live generation failed; retrying with manual fixture-news fallback"
              ALLOW_NON_TRADING_DAY_DIGEST=true npm run daily:generate -- --date "$SUMMARY_DATE" --scheduled-time "$SUMMARY_TIME" --market-data live --news-data fixture
            else
              echo "Live generation failed; fixture fallback is disabled for scheduled runs" >&2
              exit 1
            fi
          fi

      - name: Capture FII/DII history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node tools/fii-dii-capture.mjs

      - name: Import previous deployed archive
        run: |
          if curl -fsSL https://abheydeep.github.io/marketNews/archive.json -o /tmp/market-narrative-archive.json; then
            node tools/import-archive.mjs /tmp/market-narrative-archive.json
          fi

      - name: Publish static archive site
        env:
          SKIP_ARCHIVE_WRITE: ${{ env.ARCHIVE_ALREADY_TRACKED }}
        run: |
          PUBLISH_DATE="$SUMMARY_DATE"
          PUBLISH_TIME="$SUMMARY_TIME"
          SKIP_ARCHIVE_WRITE_VALUE="$ARCHIVE_ALREADY_TRACKED"
          if [ "${{ github.event_name }}" = "push" ] && [ "$ARCHIVE_ALREADY_TRACKED" != "true" ]; then
            LATEST_ARCHIVE="$(ls archive/daily/*-digest.json | sort | tail -n 1)"
            LATEST_ARCHIVE_NAME="$(basename "$LATEST_ARCHIVE")"
            PUBLISH_DATE="$(echo "$LATEST_ARCHIVE_NAME" | sed -E 's/-[0-9]{4}-digest\.json$//')"
            PUBLISH_LABEL="$(echo "$LATEST_ARCHIVE_NAME" | sed -E 's/^.*-([0-9]{4})-digest\.json$/\1/')"
            PUBLISH_TIME="${PUBLISH_LABEL:0:2}:${PUBLISH_LABEL:2:2}"
            SKIP_ARCHIVE_WRITE_VALUE="true"
            echo "Code push has no verified archive for $SUMMARY_DATE; publishing latest tracked archive $PUBLISH_DATE."
          fi
          PUBLIC_BUILD_DATE="$SUMMARY_DATE" SKIP_ARCHIVE_WRITE="$SKIP_ARCHIVE_WRITE_VALUE" npm run site:publish -- --date "$PUBLISH_DATE" --scheduled-time "$PUBLISH_TIME"

      - name: Public copy QA
        run: npm run public:copy:qa -- out/site

      - name: Commit verified daily archive for Vercel
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARCHIVE_FILE="archive/daily/${SUMMARY_DATE}-${SUMMARY_LABEL}-digest.json"
          if ! git ls-files --error-unmatch "$ARCHIVE_FILE" >/dev/null 2>&1; then
            # Fail loudly if the archive has private studio fields (teleprompterScript / reelScript)
            if grep -q '"teleprompterScript"' "$ARCHIVE_FILE" 2>/dev/null; then
              echo "ERROR: $ARCHIVE_FILE contains private teleprompterScript — run site:publish to redact before committing" >&2
              exit 1
            fi
            if grep -q '"reelScript"' "$ARCHIVE_FILE" 2>/dev/null; then
              echo "ERROR: $ARCHIVE_FILE contains private reelScript — run site:publish to redact before committing" >&2
              exit 1
            fi
            git add "$ARCHIVE_FILE"
          fi
          # The FII/DII capture step refreshes this store; commit it so Vercel rebuilds with current data.
          git add data/fii-dii-history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit (archive already tracked, store unchanged)."
          else
            git commit -m "Publish verified ${SUMMARY_TIME} briefing for ${SUMMARY_DATE}"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
