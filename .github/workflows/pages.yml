name: Publish Market Narrative Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 08:30 IST, Monday-Friday.
    - cron: "0 3 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate daily 8:30 IST summary
        run: |
          SUMMARY_DATE="$(TZ=Asia/Kolkata date +%F)"
          npm run daily:generate -- --date "$SUMMARY_DATE" --scheduled-time 08:30
          npm run site:publish -- --date "$SUMMARY_DATE" --scheduled-time 08:30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
