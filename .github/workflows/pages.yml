name: Publish Market Narrative Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh every 5 minutes across Indian and US market windows on weekdays.
    # 01:45 UTC includes the 07:15 IST pre-market publish.
    - cron: "*/5 1-21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Test generator
        run: npm test

      - name: Generate daily 7:15 IST summary
        env:
          MARKET_DATA_MODE: live
        run: |
          SUMMARY_DATE="$(TZ=Asia/Kolkata date +%F)"
          npm run daily:generate -- --date "$SUMMARY_DATE" --scheduled-time 07:15 --market-data live

      - name: Import previous deployed archive
        run: |
          if curl -fsSL https://abheydeep.github.io/marketNews/archive.json -o /tmp/market-narrative-archive.json; then
            node tools/import-archive.mjs /tmp/market-narrative-archive.json
          fi

      - name: Publish static archive site
        run: |
          SUMMARY_DATE="$(TZ=Asia/Kolkata date +%F)"
          npm run site:publish -- --date "$SUMMARY_DATE" --scheduled-time 07:15

      - name: Public copy QA
        run: npm run public:copy:qa -- out/site

      - name: Commit verified daily archive for Vercel
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          SUMMARY_DATE="$(TZ=Asia/Kolkata date +%F)"
          ARCHIVE_FILE="archive/daily/${SUMMARY_DATE}-0715-digest.json"
          if git ls-files --error-unmatch "$ARCHIVE_FILE" >/dev/null 2>&1; then
            echo "Verified archive already tracked: $ARCHIVE_FILE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARCHIVE_FILE"
          git commit -m "Publish verified daily briefing for ${SUMMARY_DATE}"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
