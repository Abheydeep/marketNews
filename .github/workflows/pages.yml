name: Publish Market Narrative Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enforce_publish_window:
        description: "Block dispatch runs if the 07:15 publish window has expired"
        required: false
        default: "false"
      triggered_by:
        description: "Manual label for the trigger source"
        required: false
        default: "manual"
  schedule:
    # Weekday 07:15 IST publish. The 07:25 IST backup is the same workflow
    # and exits once the verified archive is already committed.
    - cron: "45,55 1 * * 1-5"
    # 10:30 IST recovery run — publishes today's briefing if the 07:15 window
    # run failed or was delayed beyond the publish window.
    - cron: "0 5 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Compute IST summary date
        run: echo "SUMMARY_DATE=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_ENV"

      - name: Check existing verified archive
        run: |
          ARCHIVE_FILE="archive/daily/${SUMMARY_DATE}-0715-digest.json"
          if git ls-files --error-unmatch "$ARCHIVE_FILE" >/dev/null 2>&1; then
            echo "ARCHIVE_ALREADY_TRACKED=true" >> "$GITHUB_ENV"
            echo "Verified archive already tracked: $ARCHIVE_FILE"
          else
            echo "ARCHIVE_ALREADY_TRACKED=false" >> "$GITHUB_ENV"
          fi

      - name: Test generator
        run: npm test

      - name: Generate daily 7:15 IST summary
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.ARCHIVE_ALREADY_TRACKED != 'true'
        env:
          MARKET_DATA_MODE: live
          ALLOW_LATE_PREMARKET_PUBLISH: "true"
        run: |
          PUBLISH_ARGS=(--date "$SUMMARY_DATE" --scheduled-time 07:15 --market-data live)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.enforce_publish_window }}" = "true" ]; then
            PUBLISH_ARGS+=(--enforce-publish-window)
          fi
          npm run daily:generate -- "${PUBLISH_ARGS[@]}"

      - name: Import previous deployed archive
        run: |
          if curl -fsSL https://abheydeep.github.io/marketNews/archive.json -o /tmp/market-narrative-archive.json; then
            node tools/import-archive.mjs /tmp/market-narrative-archive.json
          fi

      - name: Publish static archive site
        env:
          SKIP_ARCHIVE_WRITE: ${{ env.ARCHIVE_ALREADY_TRACKED }}
        run: |
          PUBLISH_DATE="$SUMMARY_DATE"
          SKIP_ARCHIVE_WRITE_VALUE="$ARCHIVE_ALREADY_TRACKED"
          if [ "${{ github.event_name }}" = "push" ] && [ "$ARCHIVE_ALREADY_TRACKED" != "true" ]; then
            LATEST_ARCHIVE="$(ls archive/daily/*-0715-digest.json | sort | tail -n 1)"
            PUBLISH_DATE="$(basename "$LATEST_ARCHIVE" -0715-digest.json)"
            SKIP_ARCHIVE_WRITE_VALUE="true"
            echo "Code push has no verified archive for $SUMMARY_DATE; publishing latest tracked archive $PUBLISH_DATE."
          fi
          PUBLIC_BUILD_DATE="$SUMMARY_DATE" SKIP_ARCHIVE_WRITE="$SKIP_ARCHIVE_WRITE_VALUE" npm run site:publish -- --date "$PUBLISH_DATE" --scheduled-time 07:15

      - name: Public copy QA
        run: npm run public:copy:qa -- out/site

      - name: Commit verified daily archive for Vercel
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          ARCHIVE_FILE="archive/daily/${SUMMARY_DATE}-0715-digest.json"
          if git ls-files --error-unmatch "$ARCHIVE_FILE" >/dev/null 2>&1; then
            echo "Verified archive already tracked: $ARCHIVE_FILE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARCHIVE_FILE"
          git commit -m "Publish verified daily briefing for ${SUMMARY_DATE}"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
