name: Publish Market Narrative Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh every 5 minutes across Indian and US market windows on weekdays.
    # 03:00 UTC includes the 08:30 IST pre-market publish.
    - cron: "*/5 3-21 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Test generator
        run: npm test

      - name: Generate daily 8:30 IST summary
        env:
          MARKET_DATA_MODE: live
        run: |
          SUMMARY_DATE="$(TZ=Asia/Kolkata date +%F)"
          npm run daily:generate -- --date "$SUMMARY_DATE" --scheduled-time 08:30 --market-data live

      - name: Import previous deployed archive
        run: |
          if curl -fsSL https://abheydeep.github.io/marketNews/archive.json -o /tmp/market-narrative-archive.json; then
            node tools/import-archive.mjs /tmp/market-narrative-archive.json
          fi

      - name: Publish static archive site
        run: |
          SUMMARY_DATE="$(TZ=Asia/Kolkata date +%F)"
          npm run site:publish -- --date "$SUMMARY_DATE" --scheduled-time 08:30

      - name: Public copy QA
        run: npm run public:copy:qa -- out/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
