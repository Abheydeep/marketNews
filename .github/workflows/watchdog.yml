name: Briefing Watchdog

# The scheduled safety-net now runs on Vercel Cron (/api/cron/premarket-publish),
# which is far more punctual than GitHub Actions cron — the GitHub scheduler was
# dropping and delaying these ticks by hours, defeating the watchdog. This workflow
# is retained for manual catch-up only.
on:
  workflow_dispatch:

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify today's briefing status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY_DATE="$(TZ=Asia/Kolkata date +%F)"
          # An edition for today may have published in either the 07:15 or 08:00 slot.
          if ls "archive/daily/${SUMMARY_DATE}-0715-digest.json" "archive/daily/${SUMMARY_DATE}-0800-digest.json" >/dev/null 2>&1; then
            echo "SUCCESS: Today's briefing archive already exists. Watchdog has nothing to do."
          else
            echo "WARNING: Today's briefing archive is MISSING. Triggering manual recovery (allow late publish)..."
            # This is a manual recovery, almost always run after the window has closed,
            # so allow a late publish — otherwise pages.yml is blocked by the window guard.
            gh workflow run pages.yml -f allow_late_publish=true -f enforce_publish_window=false -f triggered_by=github-watchdog-manual
          fi
