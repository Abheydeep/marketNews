name: Market Narrative QA

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  public-copy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Install trading API test dependencies
        run: python -m pip install -r services/trading-api/requirements.txt

      - name: Repo tests
        run: npm test

      - name: Context guardrail
        run: npm run context:verify

      - name: Deployment QA gate
        env:
          MARKET_DATA_MODE: mock
          SKIP_DAILY_GENERATE: "true"
          SKIP_ARCHIVE_WRITE: "true"
          REQUIRE_MAVEN: "true"
        run: npm run test:deploy

      - name: Build public Vercel artifact
        env:
          MARKET_NARRATIVE_DEPLOY_TARGET: public
          MARKET_DATA_MODE: mock
          SKIP_DAILY_GENERATE: "true"
          SKIP_ARCHIVE_WRITE: "true"
        run: npm run vercel:build

      - name: Public copy QA
        run: npm run public:copy:qa -- public

      - name: Mobile public artifact smoke
        run: npm run mobile:smoke -- public
