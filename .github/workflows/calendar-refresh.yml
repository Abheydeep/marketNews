name: Market Calendar Verify

on:
  workflow_dispatch:
  schedule:
    # 00:37 IST daily = 19:07 UTC previous day.
    - cron: "7 19 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  calendar-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node tools/market-calendar.mjs --verify --date "$(TZ=Asia/Kolkata date +%F)"
      - run: npm test
