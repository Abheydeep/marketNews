name: Market Calendar Refresh

on:
  workflow_dispatch:
  schedule:
    # 00:37 IST daily = 19:07 UTC previous day.
    - cron: "7 19 * * *"

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node tools/market-calendar.mjs --refresh --date "$(TZ=Asia/Kolkata date +%F)"
      - run: npm test
