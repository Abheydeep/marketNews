services:
  postgres:
    image: postgres:16-alpine
    container_name: market-narrative-postgres
    environment:
      POSTGRES_DB: market_narrative
      POSTGRES_USER: narrative
      POSTGRES_PASSWORD: narrative
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narrative -d market_narrative"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: market-narrative-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
