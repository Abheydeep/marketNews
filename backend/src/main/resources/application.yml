server:
  port: ${SERVER_PORT:${PORT:8080}}

spring:
  application:
    name: market-narrative-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/market_narrative}
    username: ${DATABASE_USERNAME:narrative}
    password: ${DATABASE_PASSWORD:narrative}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

app:
  digest:
    cron: ${DIGEST_CRON:0 30 8 * * MON-FRI}
    zone: ${DIGEST_ZONE:Asia/Kolkata}
  security:
    jwt-secret: ${JWT_SECRET:change-this-local-demo-secret-change-this-local-demo-secret}
    issuer: ${JWT_ISSUER:market-narrative-local}
    trading-admin-email: ${TRADING_ADMIN_EMAIL:abhey@marketnarrative.local}
  frontend:
    allowed-origin: ${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:3000}}
  multibagger:
    live-quotes-enabled: ${MULTIBAGGER_LIVE_QUOTES_ENABLED:true}
    quote-timeout-ms: ${MULTIBAGGER_QUOTE_TIMEOUT_MS:3500}
  demo-users:
    seed-demo-admin: ${SEED_DEMO_ADMIN:true}
    demo-admin-email: ${DEMO_ADMIN_EMAIL:admin@marketnarrative.local}
    demo-admin-display-name: ${DEMO_ADMIN_DISPLAY_NAME:Market Narrative Admin}
    demo-admin-password: ${DEMO_ADMIN_PASSWORD:market-open}
    seed-trading-admin: ${SEED_TRADING_ADMIN:true}
    trading-admin-display-name: ${TRADING_ADMIN_DISPLAY_NAME:Abhey Trading Admin}
    trading-admin-password: ${ABHEY_ADMIN_PASSWORD:market-open}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
